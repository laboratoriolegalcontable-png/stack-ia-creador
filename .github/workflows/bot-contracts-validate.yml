name: Bot Contracts Validation

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate Bot Contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run contract validation
        run: node scripts/validate-bot-contracts.mjs

      - name: Upload violation report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: contract-validation-report
          path: /tmp/contract-validation-report.json
          retention-days: 7
